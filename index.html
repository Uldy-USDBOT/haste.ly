<title>Haste.ly</title>
<style>
:root{color-scheme:light;--bg:#f9f9f7;--a:#f58220;--b:#e8195f;--c:#a3104f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg)}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2vh,20px);padding:16px;font-family:"Segoe UI","Noto Naskh Arabic",Tahoma,sans-serif}
img{display:block;max-width:100%;max-height:calc(100% - 100px);width:auto;height:auto;object-fit:contain;min-height:0}
a.buy{flex:none;display:inline-block;padding:16px 56px;border-radius:999px;background:linear-gradient(90deg,var(--a),var(--b) 60%,var(--c));color:#fff;font-size:1.25rem;font-weight:700;text-decoration:none;box-shadow:0 8px 24px rgba(232,25,95,.28);transition:transform .15s,box-shadow .15s}
a.buy:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(232,25,95,.4)}
a.buy:focus-visible{outline:3px solid #222;outline-offset:4px}
</style>
